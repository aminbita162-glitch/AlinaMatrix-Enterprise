name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-test-lint:
    name: Typecheck, Test, Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alinamatrix
          POSTGRES_PASSWORD: alinamatrix_dev
          POSTGRES_DB: alinamatrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alinamatrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SUPERUSER_URL: postgres://alinamatrix:alinamatrix_dev@localhost:5432/alinamatrix
      DATABASE_URL: postgres://app_user:app_user_dev@localhost:5432/alinamatrix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialise database roles
        run: psql "$SUPERUSER_URL" -f scripts/ci-db-init.sql

      - name: Apply migrations and seed
        run: node scripts/ci-migrate.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint
