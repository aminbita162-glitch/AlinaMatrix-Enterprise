services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alinamatrix
      POSTGRES_PASSWORD: alinamatrix_dev
      POSTGRES_DB: alinamatrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alinamatrix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

# AlinaMatrix Enterprise — Enterprise Candidate — Active Development
# Phase 2: postgres and redis only. No application services in this file.
