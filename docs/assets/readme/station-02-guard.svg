<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-label="Station ST-02 AlinaGuard">
  <defs>
    <style>
      .bg-deep   { fill: #0A0F1A; }
      .bg-panel  { fill: #0F1726; }
      .bg-raise  { fill: #14203A; }
      .grid-minor { stroke: #12304F; stroke-width: 0.5; fill: none; }
      .grid-major { stroke: #1B4B7A; stroke-width: 0.8; fill: none; }
      .line-primary { stroke: #2A6FA8; stroke-width: 1.5; fill: none; }
      .text-primary { font-family: ui-monospace, "SF Mono", monospace; fill: #E6EDF3; }
      .text-muted   { font-family: ui-monospace, "SF Mono", monospace; fill: #8B9BB0; }
      .text-faint    { font-family: ui-monospace, "SF Mono", monospace; fill: #5B6B80; }

      @keyframes g2-glow { 0%,100%{stroke:#2A6FA8;stroke-opacity:.25} 50%{stroke:#2A6FA8;stroke-opacity:1} }
      .g2-glow { animation: g2-glow 3s ease-in-out infinite; }

      @keyframes g2-pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      .g2-pulse { animation: g2-pulse 3s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect class="bg-deep" width="400" height="280"/>

  <g>
    <line class="grid-minor" x1="0" y1="40"  x2="400" y2="40"/>
    <line class="grid-minor" x1="0" y1="80"  x2="400" y2="80"/>
    <line class="grid-minor" x1="0" y1="120" x2="400" y2="120"/>
    <line class="grid-minor" x1="0" y1="160" x2="400" y2="160"/>
    <line class="grid-minor" x1="0" y1="200" x2="400" y2="200"/>
    <line class="grid-minor" x1="0" y1="240" x2="400" y2="240"/>
  </g>

  <!-- station frame -->
  <rect class="bg-panel g2-glow" x="40" y="40" width="320" height="200" rx="8" stroke-width="1.5"/>

  <!-- code badge -->
  <rect class="bg-raise" x="60" y="56" width="60" height="22" rx="4"/>
  <text class="text-muted" x="90" y="71" font-size="10" text-anchor="middle">ST-02</text>

  <!-- name -->
  <text class="text-primary g2-pulse" x="200" y="100" font-size="18" font-weight="bold" text-anchor="middle">AlinaGuard</text>

  <!-- divider line -->
  <line class="line-primary" x1="80" y1="120" x2="320" y2="120" stroke-opacity="0.5"/>

  <!-- actions -->
  <rect class="bg-raise" x="90" y="133" width="220" height="24" rx="4" opacity="0.8"/>
  <text class="text-muted" x="200" y="149" font-size="11" text-anchor="middle">READ_EVIDENCE</text>
  <rect class="bg-raise" x="90" y="169" width="220" height="24" rx="4" opacity="0.8"/>
  <text class="text-muted" x="200" y="185" font-size="11" text-anchor="middle">RUN_VALIDATION</text>
  <rect class="bg-raise" x="90" y="205" width="220" height="24" rx="4" opacity="0.8"/>
  <text class="text-muted" x="200" y="221" font-size="11" text-anchor="middle">QUOTE_LOCK</text>
  <text class="text-faint" x="200" y="260" font-size="9" text-anchor="middle">AlinaMatrix Enterprise · Mission Blueprint</text>
</svg>
