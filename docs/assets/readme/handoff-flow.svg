<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-label="Station handoff flow — four agents in sequence">
  <defs>
    <style>
      .bg-deep   { fill: #0A0F1A; }
      .bg-raise  { fill: #14203A; }
      .grid-minor { stroke: #12304F; stroke-width: 0.5; fill: none; }
      .line-primary { stroke: #3FA9F5; stroke-width: 1.5; fill: none; }
      .line-soft    { stroke: #2A6FA8; stroke-width: 1; fill: none; }
      .text-primary { font-family: ui-monospace, "SF Mono", monospace; fill: #E6EDF3; }
      .text-muted   { font-family: ui-monospace, "SF Mono", monospace; fill: #8B9BB0; }
      .text-faint    { font-family: ui-monospace, "SF Mono", monospace; fill: #5B6B80; }

      @keyframes hf-flow { 0%{transform:translateX(40px);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateX(880px);opacity:0} }
      .hf-flow { animation: hf-flow 3.5s linear infinite; }

      @keyframes hf-pulse { 0%,100%{opacity:.30} 50%{opacity:1} }
      .hf-pulse { animation: hf-pulse 2.5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect class="bg-deep" width="960" height="200"/>

  <g>
    <line class="grid-minor" x1="0" y1="50"  x2="960" y2="50"/>
    <line class="grid-minor" x1="0" y1="100" x2="960" y2="100"/>
    <line class="grid-minor" x1="0" y1="150" x2="960" y2="150"/>
  </g>

  <!-- ST-01 -->
  <rect class="bg-raise hf-pulse" x="30" y="70" width="120" height="60" rx="6"/>
  <text class="text-primary" x="90" y="95" font-size="11" text-anchor="middle">ST-01</text>
  <text class="text-muted" x="90" y="112" font-size="10" text-anchor="middle">AlinaArchitect</text>

  <!-- arrow -->
  <line class="line-primary" x1="150" y1="100" x2="230" y2="100"/>
  <text class="text-faint" x="190" y="92" font-size="8" text-anchor="middle">handoff</text>

  <!-- ST-02 -->
  <rect class="bg-raise hf-pulse" x="230" y="70" width="120" height="60" rx="6"/>
  <text class="text-primary" x="290" y="95" font-size="11" text-anchor="middle">ST-02</text>
  <text class="text-muted" x="290" y="112" font-size="10" text-anchor="middle">AlinaGuard</text>

  <!-- arrow -->
  <line class="line-primary" x1="350" y1="100" x2="430" y2="100"/>
  <text class="text-faint" x="390" y="92" font-size="8" text-anchor="middle">handoff</text>

  <!-- ST-03 -->
  <rect class="bg-raise hf-pulse" x="430" y="70" width="120" height="60" rx="6"/>
  <text class="text-primary" x="490" y="95" font-size="11" text-anchor="middle">ST-03</text>
  <text class="text-muted" x="490" y="112" font-size="10" text-anchor="middle">AlinaDocEngine</text>

  <!-- arrow -->
  <line class="line-primary" x1="550" y1="100" x2="630" y2="100"/>
  <text class="text-faint" x="590" y="92" font-size="8" text-anchor="middle">handoff</text>

  <!-- ST-04 -->
  <rect class="bg-raise hf-pulse" x="630" y="70" width="120" height="60" rx="6"/>
  <text class="text-primary" x="690" y="95" font-size="11" text-anchor="middle">ST-04</text>
  <text class="text-muted" x="690" y="112" font-size="10" text-anchor="middle">AlinaOptimizer</text>

  <!-- gate label -->
  <rect class="bg-raise" x="780" y="70" width="80" height="60" rx="6" opacity="0.6"/>
  <text class="text-muted" x="820" y="95" font-size="9" text-anchor="middle">RELEASE</text>
  <text class="text-muted" x="820" y="112" font-size="9" text-anchor="middle">GATE</text>
  <line class="line-soft" x1="750" y1="100" x2="780" y2="100"/>

  <!-- flowing token -->
  <g class="hf-flow">
    <circle cx="0" cy="100" r="5" fill="#5EEAD4" opacity="0.9"/>
    <circle cx="0" cy="100" r="8" fill="none" stroke="#5EEAD4" stroke-width="0.7" opacity="0.4"/>
  </g>

  <text class="text-faint" x="480" y="170" font-size="10" text-anchor="middle">Four-eyes human review sits between AlinaGuard and AlinaDocEngine.</text>
  <text class="text-faint" x="480" y="186" font-size="10" text-anchor="middle">Control passes ST-01 → ST-02 → ST-03 → ST-04 in flow order.</text>
</svg>
